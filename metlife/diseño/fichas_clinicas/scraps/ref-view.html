<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}img{display:block;width:100%}</style></head><body><div id="o">loading…</div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(async()=>{try{
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const doc=await pdfjsLib.getDocument('../uploads/ref-ficha-catastrofico.pdf').promise;
const page=await doc.getPage(1);
const vp=page.getViewport({scale:1.3});
const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
const img=new Image();img.src=c.toDataURL('image/png');
document.getElementById('o').innerHTML='';document.getElementById('o').appendChild(img);
}catch(e){document.getElementById('o').textContent='ERR '+e.message;console.error(e);}})();
</script></body></html>
