<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Ficha de producto" description="Ficha de producto MetLife de una página: header, datos clave, tablas, condiciones generales y footer de alianza." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;background:#DCE1E6}</style></helmet>
<div style="padding:24pt 0 40pt">
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.FichaPage" style="box-shadow:0 10px 30px rgba(0,54,82,.18)" hint-size="675pt,1000pt">
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.FichaHeader" asset-base="../../assets/" badge="{{ badge }}" title="{{ titulo }}" hint-size="100%,353pt"></x-import>
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.FichaBody" hint-size="100%,600pt">
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.IntroParagraph" hint-size="100%,60pt">{{ intro }}</x-import>
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.KeyDataGrid" asset-base="../../assets/" items="{{ keyData }}" hint-size="100%,80pt"></x-import>
<sc-for list="{{ tablas }}" as="t" hint-placeholder-count="1">
<div style="display:grid;gap:10pt">
<sc-if value="{{ t.title }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.SectionTitle" hint-size="100%,24pt">{{ t.title }}</x-import>
</sc-if>
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.DataTable" columns="{{ t.columns }}" groups="{{ t.groups }}" notes="{{ t.notes }}" hint-size="100%,220pt"></x-import>
</div>
</sc-for>
<sc-if value="{{ mostrarCondiciones }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.GeneralConditions" items="{{ condiciones }}" hint-size="100%,160pt"></x-import>
</sc-if>
</x-import>
<x-import component-from-global-scope="FichasMetLifeDesignSystem_6917a8.FichaFooter" asset-base="../../assets/" partner-logo="../../assets/logo-interclinica.png" partner-name="{{ clinica }}" alliance-line="{{ alianza }}" hint-size="100%,110pt"></x-import>
</x-import>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const d = DATA[p.producto] || DATA.catastrofico;
    const clinica = p.clinica ?? 'Interclínica';
    return {
      titulo: p.titulo || d.titulo,
      badge: p.badge || d.badge,
      intro: d.intro,
      keyData: d.keyData,
      tablas: d.tablas,
      condiciones: [...CONDICIONES_BASE, 'Es exclusivo para atenciones en la Red ' + clinica + '.'],
      mostrarCondiciones: p.mostrarCondiciones ?? true,

      alianza: 'Alianza MetLife · ' + clinica,

}
