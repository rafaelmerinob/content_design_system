<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
.wrap{display:grid;grid-template-columns:1fr 150px;width:1280px;height:854px}
.main{background:var(--blue-950);display:flex;align-items:center;justify-content:center}
.main img{width:62%;height:auto}
.strip{display:grid;grid-template-rows:repeat(3,1fr)}
a{color:var(--blue-950)}a:hover{opacity:.7}</style></head><body>
<div class="wrap"><div class="main"><img src="assets/logo-metlife-white.png" alt="MetLife"></div>
<div class="strip"><div style="background:var(--teal-200)"></div><div style="background:var(--blue-200)"></div><div style="background:var(--green-300)"></div></div></div>
</body></html>
